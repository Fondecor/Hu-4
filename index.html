<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Productos - Coder</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button.delete-btn { background-color: #dc3545; padding: 5px 10px; margin-left: 10px; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .mensaje { padding: 10px; margin-top: 15px; display: none; }
        .exito { background-color: #d4edda; color: #155724; display: block; }
        .error { background-color: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>

    <h2>Gestor de Productos</h2>

    <!-- Formulario para agregar datos -->
    <div class="form-group">
        <label for="nombreProducto">Nombre del Producto:</label>
        <input type="text" id="nombreProducto" placeholder="Ej. Laptop">
    </div>
    <div class="form-group">
        <label for="precioProducto">Precio:</label>
        <input type="number" id="precioProducto" placeholder="Ej. 1200">
    </div>
    
    <button id="btnAgregar">Agregar Producto</button>
    <button id="btnSincronizar" style="background-color: #28a745;">Sincronizar con API</button>

    <!-- Mensajes dinámicos -->
    <div id="mensajeDiv" class="mensaje"></div>

    <!-- Lista dinámica -->
    <ul id="listaProductos"></ul>

    <!-- Enlace al script -->
    <script src="app.js"></script>
</body>
</html>
